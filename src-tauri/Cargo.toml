[package]
name = "lightning-fm"
version = "0.1.0"
description = "Lightning FM — P2P music streaming with Lightning payments and Nostr identity"
authors = ["Matt Loseke"]
edition = "2021"

[lib]
name = "lightning_fm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
