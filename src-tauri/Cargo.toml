[package]
name = "lightning-fm"
version = "0.1.0"
description = "Lightning FM — P2P music streaming with Lightning payments and Nostr identity"
authors = ["Matt Loseke"]
edition = "2021"

[lib]
name = "lightning_fm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ldk-node = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
dirs = "6"
log = "0.4"
nostr-sdk = "0.39"
keyring = { version = "3", features = ["apple-native"] }
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "multipart"] }
base64 = "0.22"
